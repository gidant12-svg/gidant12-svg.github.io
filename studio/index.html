<body class="art">

<main id="main">

<script src="../assets/site.js?v=20261116g"></script>
<script>
const {get, esc, url, footer} = Site;
const SETS = {};          // one set per gallery, for the lightbox
let setId = 0;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function register(items) { const id = 's' + (setId++); SETS[id] = items; return id; }
// Credits that share a name collapse into one line: "Photographed, modelled, edited · @name".
function credits(c) {
  if (!c || !c.length) return '';
  const by = new Map();
  c.forEach(([k, v]) => by.set(v, (by.get(v) || []).concat(k)));
  return `<dl class="credits">${[...by].map(([v, ks]) => `<dt>${esc(ks.map((k, i) => i ? k.toLowerCase() : k).join(', '))}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
}
function paras(list) { return (list || []).filter(Boolean).map(p => `<p>${esc(p)}</p>`).join(''); }

// One tile: a thumbnail button that opens the lightbox at item i of set.
function tile(it, set, i, sizes, cap) {
  const thumb = it.video
    ? `<img src="${esc(url(it.poster))}" width="${it.w}" height="${it.h}" alt="${esc(it.alt)}" loading="lazy" decoding="async"><span class="play">▶ ${it.seconds}s</span>`
    : `<img src="${esc(url(it.sm))}" srcset="${esc(url(it.sm))} 720w, ${esc(url(it.src))} 1600w" sizes="${sizes}"
        width="${it.w}" height="${it.h}" alt="${esc(it.alt)}" loading="lazy" decoding="async">`;
  return `<figure><button type="button" class="zoom" data-set="${set}" data-i="${i}" aria-label="Enlarge: ${esc(it.alt)}">${thumb}</button>${cap ? `<figcaption>${esc(cap)}</figcaption>` : ''}</figure>`;
}

// The latest collection opens with its animation, playing muted as the page loads.
function intro(c, w) {
  const v = w.videos[0];
  return `<div class="row intro" id="${esc(w.id)}">
    <div class="side">
      <span class="num">Collection ${esc(c.number)}</span>
      <h2 id="h-${esc(c.id)}">${esc(c.title)}</h2>
      ${c.subtitle ? `<p class="subt">${esc(c.subtitle)}</p>` : ''}
      <p class="yr">${esc(c.years)}</p>
      <div class="story">${paras(c.story)}</div>
      <hr>
      <h3>${esc(w.title)}</h3>
      <p class="dt">${esc(w.date)} · ${esc(w.medium)}</p>
      ${paras([w.text])}
      ${w.note ? `<p class="quote">“${esc(w.note)}”</p>` : ''}
      ${credits(w.credits)}
    </div>
    <div class="gal">
      <div class="screen"><video id="film" ${reduce ? 'preload="none"' : 'autoplay muted loop preload="auto"'} playsinline controls
        poster="${esc(url(v.poster))}" width="${v.w}" height="${v.h}" aria-label="${esc(w.title)}, animation">
        <source src="${esc(url(v.video))}" type="video/mp4">Your browser can't play this video.</video></div>
      <div class="vctl">
        <button type="button" id="filmPlay" aria-pressed="${reduce ? 'false' : 'true'}">${reduce ? '▶ Play' : '❚❚ Pause'}</button>
        <button type="button" id="filmSound" aria-pressed="false">🔇 Sound off</button>
      </div>
    </div>
  </div>`;
}

// One gallery: a grid of tiles sharing a lightbox set.
function gallery(c, s, works) {
  const items = [];
  works.forEach(w => {
    (w.images || []).forEach(im => items.push({...im, alt: im.alt || w.title,
      cap: s.caption === 'title' ? w.title : s.caption === 'short' ? (w.short || w.title) : '',
      full: s.caption ? w.title : `${c.title}: ${s.title}`}));
    (w.videos || []).forEach(v => items.push({...v, alt: v.caption || w.title, cap: s.caption === 'title' ? `${w.title} (motion)` : '', full: v.caption || w.title}));
  });
  if (s.lead && c.featured) {   // the collection's featured image leads its catalogue
    const k = items.findIndex(it => it.src === c.featured.src);
    if (k > 0) items.unshift(items.splice(k, 1)[0]);
    if (k >= 0 && c.featured.caption) items[0].full = c.featured.caption;
  }
  const set = register(items.map(it => ({...it, src: it.src && url(it.src), video: it.video && url(it.video), poster: it.poster && url(it.poster)})));
  const cols = s.cols || 4, anyCap = items.some(it => it.cap);
  return `<div class="grid${s.fit === 'contain' ? ' fit' : ''}${s.lead ? ' lead' : ''}${anyCap ? '' : ' nocap'}${cols !== 4 ? ' c' + cols : ''}">
      ${items.map((it, i) => tile(it, set, i, s.lead && i === 0 ? '(max-width: 560px) 100vw, 420px' : `(max-width: 560px) 50vw, ${cols > 4 ? 160 : 220}px`, it.cap)).join('')}
    </div>`;
}

// A section is one row: description on the left, its gallery (plus any smaller galleries below it) on the right.
function section(c, s, byId, header) {
  const pick = ids => (ids || []).map(id => byId[id]).filter(Boolean);
  const works = pick(s.works), below = (s.below || []).map(b => ({...b, ws: pick(b.works)}));
  const all = works.concat(...below.map(b => b.ws));
  const list = s.list ? `<ul class="wl">${all.map(w => `<li><b>${esc(w.title)}</b><span>${esc(w.date)} · ${esc(w.medium)}</span>
      ${!(s.text || []).length && w.text ? `<p>${esc(w.text)}</p>` : ''}${credits(w.credits)}</li>`).join('')}</ul>` : '';
  return `<div class="row" id="${esc(s.id)}">
    <div class="side">
      ${header || ''}
      <p class="lab">${s.label ? esc(s.label) + ' · ' : ''}${esc(s.title)}</p>
      <p class="dt">${esc(s.date || '')}</p>
      ${paras(s.text)}
      ${credits(s.credits)}
      ${list}
    </div>
    <div class="gal">${gallery(c, s, works)}
      ${below.map(b => `<p class="sublab">${esc(b.title)}${b.date ? ` <span>${esc(b.date)}</span>` : ''}</p>${gallery(c, b, b.ws)}`).join('')}
    </div>
  </div>`;
}

function collection(c) {
  const byId = Object.fromEntries(c.works.map(w => [w.id, w]));
  const iw = c.intro && byId[c.intro];
  const header = iw ? '' : `<span class="num">Collection ${esc(c.number)}</span>
      <h2 id="h-${esc(c.id)}">${esc(c.title)}</h2>${c.subtitle ? `<p class="subt">${esc(c.subtitle)}</p>` : ''}
      <p class="yr">${esc(c.years)}</p><div class="story">${paras(c.story)}</div><hr>`;
  return `<section class="cat wrap" id="${esc(c.id)}" style="--ac:${esc(c.accent)}" aria-labelledby="h-${esc(c.id)}">
    ${iw ? intro(c, iw) : ''}
    ${(c.sections || []).map((s, k) => section(c, s, byId, k === 0 ? header : '')).join('')}
  </section>`;
}

// Earlier Work keeps its year-by-year archive, now beside the same sidebar.
function journey(items) {
  // Latest first: newest year on top; within a year, newest month first (pieces dated only by year go last).
  const years = [...new Set(items.map(j => j.year))].sort((a, b) => b - a);
  const M = ['january','february','march','april','may','june','july','august','september','october','november','december'];
  const month = j => M.indexOf(String(j.date).split(' ')[0].toLowerCase());
  items = items.map((j, i) => ({...j, _i: i})).sort((a, b) => (month(b) - month(a)) || (b._i - a._i));
  return `<section class="cat wrap" id="journey" style="--ac:var(--faint)" aria-labelledby="h-journey">
    <div class="row">
      <div class="side">
        <span class="num">Collection 03</span>
        <h2 id="h-journey">Earlier Work</h2>
        <p class="subt">The journey</p>
        <p class="yr">${esc(years[years.length - 1])}–${esc(years[0])} · latest first</p>
        <div class="story"><p>Where it started: my first characters, comics and digital art, then learning to sew.</p></div>
      </div>
      <div class="gal">
      ${years.map(y => `<div class="yr-row"><b>${y}</b><div class="yr-items">${items.filter(j => j.year === y).map(j => {
          const all = j.images.concat(j.process || []), n = Math.min(all.length, 2);
          const set = register(all.map(im => ({...im, src: url(im.src), alt: im.alt || j.title, full: j.title})));
          return `<div class="ji" id="${esc(j.id)}"><div class="thumbs" style="--n:${n}">${all.slice(0, 2).map((im, k) =>
              `<button type="button" class="zoom" data-set="${set}" data-i="${k}" aria-label="Enlarge: ${esc(im.alt || j.title)}"><img src="${esc(url(im.sm))}" srcset="${esc(url(im.sm))} 720w, ${esc(url(im.src))} 1600w" sizes="170px" width="${im.w}" height="${im.h}" alt="${esc(im.alt || '')}" loading="lazy" decoding="async"></button>`).join('')}</div>
            <h3>${esc(j.title)}</h3><span class="dt">${esc(j.date)} · ${esc(j.medium)}${all.length > 2 ? ` · ${all.length} images` : ''}</span>
            ${j.text ? `<p>${esc(j.text)}</p>` : ''}</div>`;
        }).join('')}</div></div>`).join('')}
      </div>
    </div>
  </section>`;
}

function film() {
  const v = document.getElementById('film'); if (!v) return;
  const play = document.getElementById('filmPlay'), sound = document.getElementById('filmSound');
  let userPaused = reduce;
  const sync = () => {
    play.textContent = v.paused ? '▶ Play' : '❚❚ Pause'; play.setAttribute('aria-pressed', String(!v.paused));
    sound.textContent = v.muted ? '🔇 Sound off' : '🔊 Sound on'; sound.setAttribute('aria-pressed', String(!v.muted));
  };
  ['play', 'pause', 'volumechange'].forEach(e => v.addEventListener(e, sync));
  play.onclick = () => { if (v.paused) { userPaused = false; v.play().catch(() => {}); } else { userPaused = true; v.pause(); } };
  sound.onclick = () => { v.muted = !v.muted; if (!v.muted && v.paused) { userPaused = false; v.play().catch(() => {}); } };
  v.addEventListener('pause', () => { if (document.visibilityState === 'visible' && v.dataset.auto !== '1') userPaused = true; });
  if (!reduce) {
    v.muted = true; v.play().catch(() => sync());
    // Pause while scrolled out of view, resume when back (unless the visitor paused it).
    new IntersectionObserver(([e]) => {
      if (userPaused) return;
      v.dataset.auto = '1';
      if (e.isIntersecting) v.play().catch(() => {}); else v.pause();
      setTimeout(() => { v.dataset.auto = ''; }, 0);
    }, {threshold: 0.15}).observe(v);
  }
  sync();
}

Promise.all(['site.json', 'art.json'].map(get)).then(([site, art]) => {
  footer(site);
  const box = document.getElementById('catalogue');
  if (!art) { box.innerHTML = '<p class="wrap empty">The artwork couldn\'t load. Refresh to try again.</p>'; return; }
  if (art.disclaimer) document.getElementById('disclaimer').textContent = art.disclaimer;
  box.innerHTML = art.collections.map(collection).join('') + journey(art.journey || []);
  film();
  if (location.hash) { const t = document.querySelector(location.hash); if (t) t.scrollIntoView(); }
});

// Lightbox: full-size image (or video), arrows and swipe move within the same gallery.
const lb = document.getElementById('lb'), stage = document.getElementById('lbStage');
let cur = null, idx = 0;
function show() {
  const s = SETS[cur], it = s[idx];
  stage.innerHTML = it.video
    ? `<video src="${esc(it.video)}" poster="${esc(it.poster || '')}" controls autoplay playsinline loop></video>`
    : `<img src="${esc(it.src)}" alt="${esc(it.alt)}">`;
  document.getElementById('lbCap').textContent = it.full || it.cap || it.alt;
  document.getElementById('lbCount').textContent = s.length > 1 ? `${idx + 1} / ${s.length}` : '';
  document.getElementById('lbPrev').hidden = document.getElementById('lbNext').hidden = s.length < 2;
  const nx = s[(idx + 1) % s.length]; if (nx && nx.src && !nx.video) new Image().src = nx.src;   // preload the next one
}
document.addEventListener('click', e => {
  const z = e.target.closest('.zoom'); if (!z) return;
  cur = z.dataset.set; idx = +z.dataset.i; show(); lb.showModal();
  const f = document.getElementById('film'); if (f && !f.paused) { f.dataset.auto = '1'; f.pause(); lb.dataset.resume = '1'; }
});
const step = d => { const n = SETS[cur].length; idx = (idx + d + n) % n; show(); };
document.getElementById('lbPrev').onclick = () => step(-1);
document.getElementById('lbNext').onclick = () => step(1);
document.getElementById('lbClose').onclick = () => lb.close();
lb.addEventListener('click', e => { if (e.target === lb || e.target === stage) lb.close(); });
lb.addEventListener('keydown', e => { if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); });
let tx = null, ty = null;
stage.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive: true});
stage.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) && SETS[cur].length > 1) step(dx < 0 ? 1 : -1);
});
lb.addEventListener('close', () => {
  stage.innerHTML = '';
  const f = document.getElementById('film');
  if (f && lb.dataset.resume) { lb.dataset.resume = ''; f.play().catch(() => {}); setTimeout(() => { f.dataset.auto = ''; }, 0); }
});
</script>
</body>
