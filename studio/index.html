<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio · Gideon Anthony</title>
<meta name="description" content="Concept art, paintings and clothing designed and made by Gideon Anthony.">
<meta property="og:title" content="Studio · Gideon Anthony">
<meta property="og:description" content="Concept art, paintings and clothing designed and made by Gideon Anthony.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://gidant12-svg.github.io/studio/">
<meta property="og:image" content="https://gidant12-svg.github.io/images/cards/studio.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body class="studio">
<a class="skip" href="#main">Skip to content</a>
<header class="site">
  <div class="wrap top">
    <a class="brand" href="../">GIDEON ANTHONY</a>
    <nav aria-label="Pages"><a href="../">Portfolio</a><a href="../calls/">Calls</a><a href="../desk/">Desk</a><a href="../notes/">Notes</a><a href="../studio/" aria-current="page">Studio</a></nav>
  </div>
</header>
<main id="main">
  <div class="wrap"><a class="back" href="../">← Portfolio</a></div>
  <div class="wrap hero"><div class="hero-main">
    <p class="eyebrow">Outside finance</p>
    <h1>Studio</h1>
    <p class="lede">Concept art, paintings and clothing I've designed and made, with notes on how each piece came together. Tap any piece to see it full size.</p>
  </div></div>
  <section class="wrap block" aria-label="Pieces">
    <div class="gallery" id="gallery"><p class="empty">Loading…</p></div>
  </section>
</main>
<footer class="site">
  <div class="wrap">
    <div class="fl" id="footLinks"></div>
    © <span data-year>2026</span> Gideon Anthony.
  </div>
</footer>
<script src="../assets/site.js"></script>
<script>
const {get, esc, url, byDate, footer} = Site;
Promise.all(['site.json','studio.json'].map(get)).then(([site, pieces]) => {
  footer(site);
  pieces = (pieces||[]).sort(byDate);
  document.getElementById('gallery').innerHTML = pieces.length
    ? pieces.map(p => `<figure class="piece">
        <a href="${esc(url(p.image))}" target="_blank" rel="noopener"><img src="${esc(url(p.image))}" alt="${esc(p.alt||p.title)}" loading="lazy"></a>
        <figcaption><span class="pk">${esc(p.kind)}${p.when ? ' · ' + esc(p.when) : ''}</span><h3>${esc(p.title)}</h3>${p.about ? `<p>${esc(p.about)}</p>` : ''}</figcaption>
      </figure>`).join('')
    : '<p class="empty">New pieces are on their way.</p>';
});
</script>
</body>
</html>
