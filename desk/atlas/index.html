<body>
<style>
/* Layout: a paged deck; one model "lens" re-reads every slide. Single dark look, by choice. */
:root{
  color-scheme:dark;
  --bg:#0c0f15; --surface:#151a23; --surface-2:#1c232f; --surface-3:#232c3a;
  --ink:#eef1f6; --ink-soft:#aeb7c6; --ink-mute:#6f7b8d; --line:#28303d; --line-2:#333d4d;
  --gold:#e3a83c; --gold-soft:#3a2f16;
  --research:#5aa9e6; --investing:#54d59d; --deals:#b79cf0; --credit:#e7b24c;
  --advisory:#ec89a0; --specialist:#45cfbe; --corporate:#9aa6b8; --quant:#8c9bf0;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--font-mono)}
#prog{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;background:var(--gold);width:0;z-index:40;transition:width .3s ease}
#deck{height:100%;display:flex;flex-direction:column}
.stage{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;overflow-y:auto;padding:clamp(22px,5vw,64px);padding-bottom:96px;opacity:0;transform:translateY(14px);transition:opacity .4s ease,transform .4s ease;pointer-events:none;visibility:hidden}
.slide.active{opacity:1;transform:none;pointer-events:auto;visibility:visible}
@media (prefers-reduced-motion:reduce){.slide,#prog{transition:none}}
.inner{max-width:1000px;margin:0 auto;min-height:100%}
.kicker{font-family:var(--font-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.slide h2{font-family:var(--font-display);font-weight:600;font-size:clamp(24px,4.4vw,40px);line-height:1.08;letter-spacing:-.015em;margin:12px 0 8px}
.lead{font-size:clamp(15px,1.9vw,18px);color:var(--ink-soft);max-width:66ch;line-height:1.55}
.navbar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;background:linear-gradient(to top,var(--bg) 60%,transparent);z-index:35}
.navbar .btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;width:40px;height:40px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.navbar .btn:hover{border-color:var(--gold);color:var(--gold)}
.navbar .btn:disabled{opacity:.35;cursor:default;border-color:var(--line)}
.counter{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-mute);min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px;flex:1;overflow-x:auto;justify-content:center;padding:4px 0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);border:0;padding:0;cursor:pointer;flex:none;transition:background .2s,transform .2s}
.dot.on{background:var(--gold);transform:scale(1.3)}
.ovbtn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-soft);border-radius:999px;padding:9px 14px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.ovbtn:hover{border-color:var(--gold);color:var(--gold)}
.lensbtn{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.lensbtn b{font-weight:600}
@media(max-width:620px){.hint{display:none}.dots{display:none}.counter{flex:1;text-align:left}.navbar{gap:8px;padding-left:12px;padding-right:12px}.ovbtn{padding:9px 11px}}
.hint{position:fixed;right:18px;top:calc(env(safe-area-inset-top,0px) + 14px);font-family:var(--font-mono);font-size:11px;color:var(--ink-mute);z-index:36}
.title-wrap{display:flex;flex-direction:column;justify-content:center;min-height:100%;gap:18px}
.title-wrap h1{font-family:var(--font-display);font-weight:600;font-size:clamp(38px,8vw,76px);line-height:.98;letter-spacing:-.03em}
.title-wrap h1 .g{color:var(--gold)}
.title-sub{font-size:clamp(16px,2.2vw,20px);color:var(--ink-soft);max-width:60ch;line-height:1.5}
.title-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.tag{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.05em;color:var(--ink-soft);border:1px solid var(--line-2);border-radius:999px;padding:6px 12px}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
.cta{border:1px solid var(--gold);background:var(--gold);color:#17120a;border-radius:999px;padding:11px 18px;font-weight:600;font-size:14px;cursor:pointer}
.cta:hover{filter:brightness(1.08)}
.cta.ghost{background:transparent;color:var(--gold)}
.grid{display:grid;gap:14px;margin-top:22px}
@media(min-width:680px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 17px;min-width:0}
.cell h4{font-size:15.5px;margin:0 0 6px;display:flex;align-items:center;gap:9px}
.cell p{margin:0;font-size:13.7px;color:var(--ink-soft);line-height:1.5}
.pin{width:9px;height:9px;border-radius:3px;flex:none}
.matrix{margin-top:20px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mrow{display:grid;grid-template-columns:120px 1fr 1fr;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow>div{padding:13px 15px;border-right:1px solid var(--line);min-width:0}
.mrow>div:last-child{border-right:0}
.mhead{background:var(--surface-2);font-family:var(--font-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);display:flex;align-items:center}
.mside{background:var(--surface-2);font-weight:600;font-size:13.5px;display:flex;align-items:center}
.mrow .fn{font-size:13.3px;color:var(--ink-soft)}
.mrow .fn b{color:var(--ink);font-weight:600}
@media(max-width:480px){.mrow{grid-template-columns:86px 1fr 1fr}.mrow>div{padding:11px 10px}}
.spec{margin-top:30px;position:relative;padding:60px 6px 30px}
.spec-track{height:8px;border-radius:999px;background:linear-gradient(90deg,#2a3240,var(--gold))}
.spec-ends{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-mute)}
.spec-chip{position:absolute;transform:translateX(-50%);top:0;font-size:11.5px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:5px 9px;white-space:nowrap;color:var(--ink);cursor:pointer;--drop:14px}
.spec-chip:hover{border-color:var(--gold)}
.spec-chip::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:var(--drop);background:var(--line-2);transform:translateX(-50%)}
.role-top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.role-no{font-family:var(--font-display);font-weight:600;font-size:clamp(30px,6vw,52px);line-height:1;color:var(--rc,var(--gold));min-width:52px}
.role-id{flex:1;min-width:220px}
.role-cat{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--rc,var(--gold))}
.role-name{font-family:var(--font-display);font-weight:600;font-size:clamp(22px,3.6vw,32px);line-height:1.05;margin-top:4px}
.side-badge{font-family:var(--font-mono);font-size:11px;padding:5px 11px;border-radius:999px;border:1px solid var(--rc,var(--gold));color:var(--rc,var(--gold));white-space:nowrap;align-self:center}
.dcf-meter{display:flex;align-items:center;gap:9px;margin-top:4px;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-mute);flex-wrap:wrap}
.dcf-bar{width:96px;height:6px;border-radius:999px;background:var(--line-2);overflow:hidden}
.dcf-fill{height:100%;background:var(--rc,var(--gold));transition:width .35s ease}
.role-body{display:grid;gap:13px;margin-top:22px}
@media(min-width:680px){.role-body{grid-template-columns:1fr 1fr}}
.rb{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:15px 16px;border-left:3px solid var(--rc,var(--gold));min-width:0}
.rb .lab{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--rc,var(--gold));margin-bottom:8px}
.rb ul{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:6px}
.rb li{font-size:13.6px;color:var(--ink-soft);line-height:1.45}
.rb li b{color:var(--ink);font-weight:600}
.kit{margin-top:16px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:13px 15px}
.kit-lab{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kit-row{display:flex;flex-wrap:wrap;gap:8px}
.kchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-soft)}
.kchip:hover{border-color:var(--gold);color:var(--ink)}
.kchip.on{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.kchip .kb{width:34px;height:4px;border-radius:999px;background:var(--line-2);overflow:hidden;display:inline-block}
.kchip .kb i{display:block;height:100%;background:var(--gold)}
.kchip .ks{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-mute);font-variant-numeric:tabular-nums}
.sectbl{margin-top:20px;overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:540px;font-size:13.5px}
th,td{text-align:left;padding:12px 15px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mute);font-weight:400}
td:first-child{font-weight:600;color:var(--ink)}
td b{color:var(--gold);font-weight:600}
tr:last-child td{border-bottom:0}
.heat table{min-width:860px;font-size:12px}
.heat th,.heat td{padding:0;text-align:center;vertical-align:middle;border-right:1px solid var(--bg);border-bottom:1px solid var(--bg)}
.heat th{padding:9px 4px;font-size:10px;letter-spacing:.03em;text-transform:none}
.heat th button{background:none;border:0;color:var(--ink-soft);cursor:pointer;font-family:var(--font-mono);font-size:10.5px;padding:2px 4px;border-radius:5px;line-height:1.25}
.heat th button:hover{color:var(--gold)}
.heat .rowh{position:sticky;left:0;z-index:1;background:var(--surface-2);text-align:left;min-width:150px}
.heat .rowh button{width:100%;text-align:left;background:none;border:0;padding:9px 12px;cursor:pointer;color:var(--ink);font-family:var(--font-body);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:8px}
.heat .rowh button:hover{color:var(--gold)}
.heat td.hc{font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums;width:56px;height:34px;cursor:pointer}
.heat tr.on .rowh{box-shadow:inset 3px 0 0 var(--gold);background:var(--gold-soft)}
.heat tr.on .rowh button{color:var(--gold)}
.heat tr.on td.hc{outline:1px solid rgba(227,168,60,.55);outline-offset:-1px}
.heat-key{display:flex;align-items:center;gap:8px;margin-top:12px;font-family:var(--font-mono);font-size:11px;color:var(--ink-mute);flex-wrap:wrap}
.heat-key .ramp{width:140px;height:8px;border-radius:999px;background:linear-gradient(90deg,var(--surface),var(--gold))}
.stack{margin-top:22px;display:flex;flex-direction:column;gap:11px}
.srow{display:flex;gap:15px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 16px}
.srow .n{font-family:var(--font-display);font-weight:600;font-size:22px;color:var(--gold);min-width:30px}
.srow .t b{font-size:15px;color:var(--ink)}
.srow .t p{margin:3px 0 0;font-size:13.3px;color:var(--ink-soft)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
.qcard .q{font-size:15px;font-weight:600;margin-bottom:9px}
.branch{display:flex;gap:10px;flex-wrap:wrap}
.branch span,.branch button{font-size:12.8px;padding:6px 11px;border-radius:9px;background:var(--surface-3);color:var(--ink-soft);border:1px solid transparent;text-align:left}
.branch button{cursor:pointer}
.branch button:hover{border-color:var(--line-2);color:var(--ink)}
.branch button.on{border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}
.branch span b,.branch button b{color:var(--gold)}
.qresult{margin-top:14px;background:var(--surface-2);border:1px solid var(--gold);border-radius:14px;padding:15px 17px}
.qresult .qr-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qresult .qr-h b{font-family:var(--font-display);font-size:18px}
.linkbtn{background:none;border:0;color:var(--ink-mute);font-family:var(--font-mono);font-size:11px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--gold)}
.qr-list{display:grid;gap:10px;margin-top:12px}
@media(min-width:680px){.qr-list{grid-template-columns:1fr 1fr 1fr}}
.qr-item{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--rc,var(--gold));border-radius:11px;padding:12px 13px;display:flex;flex-direction:column;gap:6px;min-width:0}
.qr-item .qn{font-weight:600;font-size:14px}
.qr-item .qm{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-mute)}
.qr-item .kit-row{gap:6px}
.qr-item .kchip{padding:4px 8px;font-size:11.5px}
.you{margin-top:18px;display:grid;gap:12px}
@media(min-width:680px){.you{grid-template-columns:1fr 1fr}}
.youcard{border:1px solid var(--line);border-left:3px solid var(--gold);background:var(--surface);border-radius:12px;padding:15px 16px}
.youcard h4{font-size:15px;margin:0 0 6px;color:var(--gold)}
.youcard p{margin:0;font-size:13.6px;color:var(--ink-soft);line-height:1.5}
.youcard p b{color:var(--ink)}
.flowmap{margin-top:20px;display:flex;flex-direction:column;gap:14px}
.flow-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-family:var(--font-mono);font-size:11px;color:var(--ink-mute)}
.flow-legend span{display:inline-flex;align-items:center;gap:6px}
.flow-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.flowrow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px;border-left:3px solid var(--gold)}
.flow-src{font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--ink);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flow-side{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mute);border:1px solid var(--line-2);border-radius:999px;padding:3px 9px}
.flow-arrows{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.flow-to{font-size:13.6px;color:var(--ink);padding:9px 12px;border-radius:9px;background:var(--surface-2);border-left:3px solid var(--ink-mute)}
.flow-to em{display:block;font-style:normal;font-size:12.4px;color:var(--ink-soft);margin-top:3px}
.flow-to.strong{border-left-color:var(--investing)}
.flow-to.mid{border-left-color:var(--gold)}
.flow-to.weak{border-left-color:var(--ink-mute);opacity:.9}
.flow-to .lk{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;margin-left:6px}
.flow-to.strong .lk{background:rgba(84,213,157,.14);color:var(--investing)}
.flow-to.mid .lk{background:rgba(227,168,60,.16);color:var(--gold)}
.flow-to.weak .lk{background:var(--surface-3);color:var(--ink-mute)}
.src-note{margin-top:16px;font-family:var(--font-mono);font-size:11px;color:var(--ink-mute);line-height:1.5}
.goalcard{border-top:3px solid var(--gc,var(--gold))}
.goalcard h4{font-size:15px;margin:0 0 4px}
.goalcard .own,.goalcard .pay{margin:6px 0 0;font-size:12.8px;color:var(--ink-soft);line-height:1.45}
.goalcard .own b,.goalcard .pay b{color:var(--ink);font-weight:600}
.goalcard .via{margin:10px 0 0;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-mute);line-height:1.4}
.ladder{margin-top:26px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ladder .rung{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.ladder .rung.top{border-color:var(--gold);color:var(--gold);font-weight:500}
.ladder .arw{color:var(--ink-mute);font-size:13px}
.ladder .lbl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mute);width:100%;margin-bottom:2px}
.statrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:20px}
@media(max-width:560px){.statrow{grid-template-columns:1fr}}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
.stat .num{font-family:var(--font-display);font-weight:600;font-size:26px;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.stat .cap{font-size:12.3px;color:var(--ink-soft);margin-top:6px;line-height:1.4}
.srclist{margin-top:20px;display:grid;gap:10px}
@media(min-width:680px){.srclist{grid-template-columns:1fr 1fr}}
.srcitem{display:block;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 14px;text-decoration:none;color:inherit;border-left:3px solid var(--gold)}
.srcitem:hover{border-color:var(--gold)}
.srcitem .st{font-size:13.8px;font-weight:600;color:var(--ink);display:block}
.srcitem .sd{font-size:12.2px;color:var(--ink-soft);margin-top:3px;display:block}
.srcitem .sty{font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-mute);margin-top:6px;display:inline-block}
/* model picker */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px;margin-top:20px}
.mcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer;display:flex;flex-direction:column;gap:5px;border-top:3px solid var(--mc,var(--gold))}
.mcard:hover{border-color:var(--line-2);border-top-color:var(--mc,var(--gold))}
.mcard.on{background:var(--gold-soft);border-color:var(--gold);border-top-color:var(--gold)}
.mcard .mn{font-weight:600;font-size:14px;color:var(--ink)}
.mcard .mq{font-size:12.3px;color:var(--ink-soft);line-height:1.4}
.mcard .mf{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-mute);margin-top:auto;padding-top:4px}
.mdetail{margin-top:18px;display:grid;gap:13px}

/* readiness: share of a seat's three most-used models you already know, weighted by how central each is */
function readiness(ri,set){
 const top=MODELS.map(m=>({id:m.id,v:m.s[ri]})).sort((a,b)=>b.v-a.v).slice(0,3);
 const tot=top.reduce((a,x)=>a+x.v,0);
 return Math.round(top.reduce((a,x)=>a+(set.includes(x.id)?x.v:0),0)/tot*100);
}

/* ---------- deck ---------- */
const stage=document.getElementById('stage');
let cur=0;
stage.innerHTML=SLIDES.map((s,i)=>`<section class="slide" data-i="${i}">${build(s)}</section>`).join('');
const slides=[...document.querySelectorAll('.slide')];
const dots=document.getElementById('dots');
dots.innerHTML=SLIDES.map((s,i)=>`<button class="dot" data-i="${i}" aria-label="Slide ${i+1}"></button>`).join('');
const dotEls=[...document.querySelectorAll('.dot')];
const counter=document.getElementById('counter');
const prog=document.getElementById('prog');
const prevB=document.getElementById('prev'), nextB=document.getElementById('next');

function rerender(){
 const k=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.k:null;
 slides.forEach((el,i)=>{el.innerHTML=build(SLIDES[i]);});
 document.getElementById('lensName').textContent=L().short;
 buildLensGrid(); buildOverview();
 layoutSpectrum();
 if(k){const el=stage.querySelector(`[data-k="${CSS.escape(k)}"]`); if(el) el.focus({preventScroll:true});}
}
function go(i){
 cur=Math.max(0,Math.min(SLIDES.length-1,i));
 slides.forEach((s,k)=>s.classList.toggle('active',k===cur));
 dotEls.forEach((d,k)=>d.classList.toggle('on',k===cur));
 counter.textContent=(cur+1)+' / '+SLIDES.length;
 prog.style.width=((cur)/(SLIDES.length-1)*100)+'%';
 prevB.disabled=cur===0; nextB.disabled=cur===SLIDES.length-1;
 slides[cur].scrollTop=0;
 if(SLIDES[cur].type==='spectrum') layoutSpectrum();
}
function setLens(id){
 if(!M[id]) return;
 lens=id; save('lens',id);
 try{history.replaceState(null,'','#'+id);}catch(e){}
 rerender();
}

/* spectrum: stack chips into rows so none overlap, then draw each leader line down to the track */
function layoutSpectrum(){
 const spec=document.getElementById('spec'); if(!spec) return;
 const W=spec.clientWidth-12; if(W<=0) return;
 const chips=[...spec.querySelectorAll('.spec-chip')];
 const rows=[]; const placed=[];
 chips.forEach(ch=>{
   const w=ch.offsetWidth, h=ch.offsetHeight;
   const cx=Math.max(w/2,Math.min(W-w/2,(+ch.dataset.x/100)*W));
   let r=rows.findIndex(end=>end+6<=cx-w/2);
   if(r<0){r=rows.length;rows.push(0);}
   rows[r]=cx+w/2;
   placed.push({ch,cx,r,h});
 });
 const rowH=32, padTop=rows.length*rowH+20;
 spec.style.paddingTop=padTop+'px';
 placed.forEach(p=>{
   p.ch.style.left=(p.cx+6)+'px';
   p.ch.style.top=(p.r*rowH)+'px';
   p.ch.style.setProperty('--drop',Math.max(6,padTop-p.r*rowH-p.h)+'px');
 });
}

prevB.onclick=()=>go(cur-1); nextB.onclick=()=>go(cur+1);
dotEls.forEach(d=>d.onclick=()=>go(+d.dataset.i));

stage.addEventListener('click',e=>{
 const t=e.target.closest('[data-lens],[data-go],[data-know],[data-ans],[data-reset]'); if(!t) return;
 if(t.dataset.lens){setLens(t.dataset.lens);return;}
 if(t.dataset.go){go(+t.dataset.go);return;}
 if(t.dataset.know){const id=t.dataset.know; known=known.includes(id)?known.filter(x=>x!==id):[...known,id]; save('known',known); rerender(); return;}
 if(t.dataset.ans){const [q,a]=t.dataset.ans.split(':').map(Number); if(answers[q]===a) delete answers[q]; else answers[q]=a; save('answers',answers); rerender(); return;}
 if(t.dataset.reset){answers={}; save('answers',answers); rerender(); return;}
});

const TITLES={title:'Cover',picker:'Which model do you know?',matrix:'Orient: the map',spectrum:()=>`Where ${L().short} fits`,heatmap:'Every model × every seat',sector:'Sector lenses',pathways:'Career pathways',goals:'End goals',canada:'Canada lens',stack:'God-mode stack',builder:'Build your model stack',navigate:'How to choose',close:'My path',sources:'Sources'};
function buildOverview(){
 ovGrid.innerHTML=SLIDES.map((s,i)=>{const t=s.type==='role'?s.r.name:(typeof TITLES[s.type]==='function'?TITLES[s.type]():TITLES[s.type]);return `<button class="ov-item" data-i="${i}"><span class="oi-n">${String(i+1).padStart(2,'0')}</span><span class="oi-t">${t||''}</span></button>`;}).join('');
}
function buildLensGrid(){
 lensGrid.innerHTML=MODELS.map(m=>`<button class="ov-item${m.id===lens?' on':''}" data-m="${m.id}" style="border-top:3px solid ${C[m.cat]}"><span class="oi-n">core in ${seatsWhereCore(m)} of 12 seats</span><span class="oi-t">${m.name}</span><span class="oi-q">${m.q}</span></button>`).join('');
}
ovGrid.addEventListener('click',e=>{const t=e.target.closest('[data-i]'); if(t){go(+t.dataset.i); ov.hidden=true;}});
lensGrid.addEventListener('click',e=>{const t=e.target.closest('[data-m]'); if(t){setLens(t.dataset.m); lensSheet.hidden=true;}});
document.getElementById('ovOpen').onclick=()=>{ov.hidden=false;};
document.getElementById('ovClose').onclick=()=>{ov.hidden=true;};
document.getElementById('lensOpen').onclick=()=>{lensSheet.hidden=false;};
document.getElementById('lensClose').onclick=()=>{lensSheet.hidden=true;};

document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){ov.hidden=true;lensSheet.hidden=true;return;}
 if(!ov.hidden||!lensSheet.hidden) return;
 if(e.key==='ArrowRight'||e.key==='PageDown'){go(cur+1);e.preventDefault();}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(cur-1);e.preventDefault();}
 else if(e.key==='Home')go(0); else if(e.key==='End')go(SLIDES.length-1);
 else if((e.key==='l'||e.key==='L')&&!e.metaKey&&!e.ctrlKey){lensSheet.hidden=false;}
});
let tx=0,ty=0;
stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{
 if(e.target.closest('.sectbl')) return;
 const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
 if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){dx<0?go(cur+1):go(cur-1);}
},{passive:true});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1); if(M[id]&&id!==lens) setLens(id);});
let rz; window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(layoutSpectrum,120);});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layoutSpectrum);
setTimeout(()=>{const h=document.getElementById('hint');if(h){h.style.transition='opacity .6s';h.style.opacity='0';}},4200);

document.getElementById('lensName').textContent=L().short;
buildOverview(); buildLensGrid();
go(0); layoutSpectrum();
